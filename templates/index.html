<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chatbot</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f4f4;
        }
        #chat-box {
            border: 1px solid #ccc;
            padding: 10px;
            width: 100%;
            height: 400px;
            overflow-y: auto;
            background-color: white;
        }
        .user, .bot {
            margin: 10px 0;
        }
        .user {
            color: blue;
        }
        .bot {
            color: green;
        }
        #user-input {
            width: calc(100% - 100px);
            padding: 10px;
        }
        button {
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>
    <h1>AI Chatbot</h1>
    <div id="chat-box"></div>
    <input type="text" id="user-input" placeholder="Type your message here..." onkeydown="handleEnter(event)">
    <button onclick="sendMessage()">Send</button>

    <script>
        function sendMessage() {
            const userInputElem = document.getElementById("user-input");
            const userInput = userInputElem.value.trim();
            if (userInput === "") return;
    
            const chatBox = document.getElementById("chat-box");
            chatBox.innerHTML += `<div class="user">You: ${userInput}</div>`;
    
            fetch("/chat", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                },
                body: JSON.stringify({ user_input: userInput }),
            })
            .then(response => response.json())
            .then(data => {
                chatBox.innerHTML += `<div class="bot">Bot: ${data.response}</div>`;
                userInputElem.value = ""; // Clear the input field
                chatBox.scrollTop = chatBox.scrollHeight; // Scroll to bottom
            })
            .catch(error => {
                chatBox.innerHTML += `<div class="bot">Bot: Sorry, something went wrong!</div>`;
            });
        }

        // Allow Enter key to send the message
        function handleEnter(event) {
            if (event.key === "Enter") {
                sendMessage();
            }
        }
    </script>
</body>
</html>
